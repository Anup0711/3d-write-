<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 3D Studio (Neural4D)</title>
    <!-- Google 3D model-viewer component -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        :root { --primary: #4f46e5; --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; --border: #334155; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); padding: 16px; font-family: system-ui, -apple-system, sans-serif; max-width: 900px; margin: 0 auto; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 8px; overflow-x: auto; }
        .tab-btn { background: transparent; color: #94a3b8; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; transition: 0.2s; }
        .tab-btn.active { background: var(--primary); color: white; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 24px; border: 1px solid var(--border); margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: #94a3b8; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: white; box-sizing: border-box; font-size: 14px; }
        .key-input { border-color: #ff9800; background: #2a1f10; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn-main { width: 100%; padding: 14px; background: var(--primary); color: white; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; }
        .btn-main:disabled { background: #475569; cursor: not-allowed; }
        .viewer-box { position: relative; height: 400px; background: radial-gradient(circle, #334155 0%, #0f172a 100%); border-radius: 12px; overflow: hidden; margin-top: 20px; border: 1px solid var(--border); }
        model-viewer { width: 100%; height: 100%; }
        .action-btns { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; z-index: 10; }
        .action-btn { background: rgba(0,0,0,0.7); border: 1px solid var(--border); color: white; padding: 8px 12px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
        .gallery-item { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 12px; cursor: pointer; }
        .gallery-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .gallery-tag { font-size: 11px; color: #94a3b8; }
        #loader { display: none; text-align: center; padding: 20px; color: #60a5fa; font-weight: bold; }
    </style>
</head>
<body>
    <header style="margin-bottom: 20px;">
        <h2>✨ AI 3D Studio (Neural4D)</h2>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('generator')">⚡ Generator</button>
        <button class="tab-btn" onclick="switchTab('history')">🕒 History (<span id="history-count">0</span>)</button>
        <button class="tab-btn" onclick="switchTab('wishlist')">❤️ Wishlist (<span id="wishlist-count">0</span>)</button>
    </div>

    <section id="tab-generator" class="tab-content card">
        <div class="form-group">
            <label>Neural4D API Key</label>
            <input type="password" id="api-key" class="key-input" placeholder="Paste your Neural4D API key here...">
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>Speed Mode</label>
                <select id="speed-mode">
                    <option value="fastest">⚡ Fastest (No Textures / Mesh Only)</option>
                    <option value="balanced" selected>🎨 Standard (Full Textures & Color)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Color Theme</label>
                <select id="color">
                    <option value="">Default AI Choice</option>
                    <option value="Neon Cyberpunk">Cyberpunk Neon</option>
                    <option value="Dark Monochrome">Dark Monochrome</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Prompt</label>
            <input type="text" id="prompt" placeholder="e.g., A futuristic sports car" required>
        </div>

        <button class="btn-main" id="generate-btn" onclick="generateRealModel()">Generate 3D Model</button>

        <div id="loader">
            <div id="status-text">Connecting to Neural4D API...</div>
            <div style="font-size: 12px; color: #94a3b8; margin-top: 5px;">Rendering takes 60-90 seconds...</div>
        </div>

        <div class="viewer-box" id="viewer-wrapper" style="display: none;">
            <div class="action-btns">
                <button class="action-btn" onclick="downloadCurrentModel()">⬇️ Download .GLB</button>
                <button class="action-btn" onclick="toggleWishlist()">❤️ Wishlist</button>
            </div>
            <model-viewer id="main-viewer" auto-rotate camera-controls></model-viewer>
        </div>
    </section>

    <section id="tab-history" class="tab-content card" style="display: none;">
        <h3 style="margin-bottom: 12px;">Generation History</h3>
        <div class="gallery-grid" id="history-grid"></div>
    </section>

    <section id="tab-wishlist" class="tab-content card" style="display: none;">
        <h3 style="margin-bottom: 12px;">Your Saved Wishlist</h3>
        <div class="gallery-grid" id="wishlist-grid"></div>
    </section>

    <script>
        let currentActiveModel = null;
        let historyList = JSON.parse(localStorage.getItem('ai_3d_history') || '[]');
        let wishlistList = JSON.parse(localStorage.getItem('ai_3d_wishlist') || '[]');

        function updateCounters() {
            document.getElementById('history-count').innerText = historyList.length;
            document.getElementById('wishlist-count').innerText = wishlistList.length;
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('tab-' + tabName).style.display = 'block';
            event.target.classList.add('active');
            if (tabName === 'history') renderGrid('history-grid', historyList);
            if (tabName === 'wishlist') renderGrid('wishlist-grid', wishlistList);
        }

        function renderGrid(containerId, list) {
            const grid = document.getElementById(containerId);
            grid.innerHTML = list.length === 0 ? '<p style="color:#94a3b8">No models saved yet.</p>' : '';
            list.forEach(item => {
                grid.innerHTML += `
                    <div class="gallery-item" onclick="loadToViewer('${item.name.replace(/'/g, "\\'")}', '${item.url}')">
                        <div class="gallery-title">${item.name}</div>
                        <div class="gallery-tag">${item.tag}</div>
                    </div>`;
            });
        }

        function loadToViewer(name, url) {
            currentActiveModel = { name, url };
            document.getElementById('main-viewer').src = url;
            switchTab('generator');
            document.getElementById('viewer-wrapper').style.display = 'block';
        }

        const sleep = (ms) => new Promise(res => setTimeout(res, ms));

        async function generateRealModel() {
            // Strip invisible Unicode characters from API key if copied incorrectly
            const rawKey = document.getElementById('api-key').value;
            const apiKey = rawKey.replace(/[^\x20-\x7E]/g, '').trim();

            let prompt = document.getElementById('prompt').value.trim();
            const speedMode = document.getElementById('speed-mode').value;
            const color = document.getElementById('color').value;

            if (!apiKey) return alert('Please paste your Neural4D API key first!');
            if (!prompt) return alert('Enter a prompt!');
            if (color && speedMode !== "fastest") prompt += `, in ${color} colors`;

            const btn = document.getElementById('generate-btn');
            const loader = document.getElementById('loader');
            const statusText = document.getElementById('status-text');
            const viewerWrapper = document.getElementById('viewer-wrapper');

            btn.disabled = true;
            loader.style.display = 'block';
            viewerWrapper.style.display = 'none';

            try {
                // STEP 1: Submit to Neural4D
                const createUrl = "https://alb.neural4d.com:3000/api/generateModelWithText";
                statusText.innerText = "Submitting task to Neural4D...";

                const createRes = await fetch(createUrl, {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json", 
                        "Authorization": `Bearer ${apiKey}` 
                    },
                    body: JSON.stringify({ 
                        prompt: prompt, 
                        modelCount: 1,
                        // disablePbr: 1 skips textures making it much faster.
                        disablePbr: speedMode === "fastest" ? 1 : 0 
                    })
                });

                // Detailed Error Logging
                if (!createRes.ok) {
                    const errText = await createRes.text();
                    throw new Error(`Server returned ${createRes.status}: ${errText}`);
                }

                const createData = await createRes.json();
                if (!createData.uuids || createData.uuids.length === 0) {
                    throw new Error(createData.message || "Task failed to start. Ensure you have enough API Credits.");
                }

                const uuid = createData.uuids[0];
                let isFinished = false;
                let modelUrl = "";

                // STEP 2: Poll status
                const statusUrl = "https://alb.neural4d.com:3000/api/retrieveModel";
                let elapsedSeconds = 0;

                while (!isFinished) {
                    statusText.innerText = `Rendering 3D model (Elapsed: ~${elapsedSeconds}s)...`;
                    await sleep(3000);
                    elapsedSeconds += 3;

                    const statusRes = await fetch(statusUrl, {
                        method: "POST",
                        headers: { 
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${apiKey}` 
                        },
                        body: JSON.stringify({ uuid: uuid })
                    });

                    const statusData = await statusRes.json();
                    const codeStatus = statusData.codeStatus;

                    if (codeStatus === 0) {
                        isFinished = true;
                        modelUrl = statusData.modelUrl;
                    } else if (codeStatus === -3 || codeStatus < 0) {
                        throw new Error(statusData.message || "Generation failed on server.");
                    }
                }

                // STEP 3: Display
                currentActiveModel = { name: prompt, tag: speedMode, url: modelUrl };
                document.getElementById('main-viewer').src = modelUrl;
                viewerWrapper.style.display = 'block';

                historyList.unshift(currentActiveModel);
                localStorage.setItem('ai_3d_history', JSON.stringify(historyList));
                updateCounters();

            } catch (err) {
                // This alert will now show the EXACT reason the server rejected it
                alert(`Error Details:\n\n${err.message}`);
            } finally {
                btn.disabled = false;
                loader.style.display = 'none';
            }
        }

        async function downloadCurrentModel() {
            if (!currentActiveModel) return;
            try {
                const response = await fetch(currentActiveModel.url);
                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = downloadUrl;
                let safeName = currentActiveModel.name.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                a.download = safeName + '.glb';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(downloadUrl);
                document.body.removeChild(a);
            } catch (error) {
                alert("Download failed. Browser blocked the request.");
            }
        }

        function toggleWishlist() {
            if (!currentActiveModel) return;
            if (!wishlistList.some(i => i.url === currentActiveModel.url)) {
                wishlistList.unshift(currentActiveModel);
                localStorage.setItem('ai_3d_wishlist', JSON.stringify(wishlistList));
                alert('Saved to Wishlist!');
            } else {
                alert('Already in Wishlist!');
            }
            updateCounters();
        }

        updateCounters();
    </script>
</body>
</html>
